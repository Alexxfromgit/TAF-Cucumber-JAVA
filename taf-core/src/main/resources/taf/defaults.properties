# Framework defaults. Override in src/test/resources/taf.properties, env/<env>.properties,
# -Dkey=value or environment variables (KEY_IN_UPPER_SNAKE_CASE).

# --- Web --------------------------------------------------------------------------------
# chrome | firefox | edge (drivers are resolved automatically by Selenium Manager)
browser.name=chrome
browser.headless=false
browser.window-size=1440x900
browser.args=
browser.page-load-timeout=60s
# false: new browser per scenario (isolation) | true: keep it per thread, clear cookies and storage (speed)
browser.reuse=false
# attribute used by @Locate(testId = ...)
web.test-id-attribute=data-test

# --- Waits ------------------------------------------------------------------------------
wait.timeout=10s
wait.poll=200ms
wait.page-timeout=20s

# --- HTTP -------------------------------------------------------------------------------
http.connect-timeout=10s
http.read-timeout=30s
# extra headers hidden in Allure attachments (Authorization, Cookie, X-API-Key are always hidden)
http.masked-headers=

# --- Verification -----------------------------------------------------------------------
# hard: first failed Verify fails the step | soft: collect all failures, report after the last step
verify.mode=hard

# --- Evidence ---------------------------------------------------------------------------
evidence.screenshot-on-failure=true
evidence.page-source-on-failure=true

# --- Lint -------------------------------------------------------------------------------
lint.require-epic=true
lint.require-owner=true
lint.secrets=true
lint.quarantine.max-days=90

taf.secrets-guard.enabled=true
