# Cucumber on the JUnit Platform. System properties override these, e.g. -Dcucumber.filter.tags="@smoke".
cucumber.glue=io.github.alexxfromgit.taf.cucumber.core.hooks,io.github.alexxfromgit.taf.cucumber.examples
cucumber.plugin=pretty,\
  io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm,\
  io.github.alexxfromgit.taf.cucumber.core.hooks.TafCucumberPlugin
cucumber.publish.quiet=true
cucumber.snippet-type=camelcase

# Scenarios run in parallel; every thread has its own browser and scenario state.
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=3
cucumber.execution.parallel.config.fixed.max-pool-size=3
